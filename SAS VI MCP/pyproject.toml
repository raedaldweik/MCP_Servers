[project]
name = "sas-vi-mcp"
version = "1.0.0"
description = "SAS Visual Investigator MCP server for SAS Retrieval Agent Manager (alerts, entities, search, network, workflow)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.38.0",
]

[project.scripts]
app-http-direct = "sas_vi_mcp.http_server:main"
app-stdio = "sas_vi_mcp.stdio_server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errors, pyflakes, imports, bugbear, comprehensions, pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP"]
